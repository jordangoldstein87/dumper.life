<!doctype html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0806;--ink:#fbf1dc;--mute:#bfa37f;--gold:#f6b93b;--fire:#ff6a1a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(900px 600px at 50% 10%,#3a1d0a,transparent 65%),var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:28px 16px 60px;text-align:center}
.hi{font:400 clamp(34px,9vw,48px)/1 "Sedgwick Ave Display",Anton,sans-serif;transform:rotate(-2deg);margin:4px 0 18px;text-shadow:3px 3px 0 #000}
.stage{perspective:1400px;margin:0 auto 22px;width:min(100%,420px)}
.card{display:block;width:100%;border-radius:22px;box-shadow:0 30px 80px #000c,0 0 60px #f6b93b22;transform:rotateY(90deg) scale(.6);opacity:0;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) .25s forwards}
@keyframes pop{60%{transform:rotateY(-12deg) scale(1.04);opacity:1}100%{transform:none;opacity:1}}
.card:hover{transform:rotate(-1deg) scale(1.01);transition:transform .2s}
.btn{display:inline-block;font:400 17px Anton,Impact,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#120b06;background:var(--gold);padding:15px 22px 13px;border-radius:2px;text-decoration:none;box-shadow:5px 5px 0 #000,5px 5px 0 1px #6b4a2a;margin:6px}
.btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold);box-shadow:none}
.invite{margin-top:30px;text-align:left;padding:22px;border:1px solid #4a3220;border-left:4px solid var(--gold);background:#140d08;border-radius:4px}
.invite h2{font:400 22px Anton,Impact,sans-serif;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.invite p{color:var(--mute)}
.invite q{display:block;margin-top:10px;font:400 26px "Sedgwick Ave Display",Anton,sans-serif;color:var(--ink);quotes:none}
</style>
</head>
<body>
<main>
  <div class="hi">Welcome, Dumper #8.</div>
  <div class="stage"><img class="card" src="/c/dolav/card.jpg" alt="DUMPER #8 card — Dolav"></div>
  <a class="btn" href="/c/dolav/card.jpg" download="Dumper-8-Dolav.jpg">Download your card ↓</a>
  <a class="btn ghost" href="/">Enter dumper.life</a>
  <section class="invite">
    <h2>Invite a Dumper</h2>
    <p>There's only one way in. Text them privately and tell them to say it in the HUGHESPAUL chat:</p>
    <q>"I am a Dumper."</q>
    <p style="margin-top:10px">That's how they get access.</p>
  </section>
</main>
<script src="/t.js?v=3" defer></script>
</body>
</html>
