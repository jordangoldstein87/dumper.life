<!doctype html>
<html lang="en" data-tee="came-in-late">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dump Patrol Black Friday</title>
<meta name="description" content="Black Friday: 96% off all Dump Patrol merch with code DUMPER96.">
<meta property="og:title" content="DUMP PATROL · BLACK FRIDAY SALE">
<meta property="og:description" content="Code DUMPER96 at checkout. Every Dump Patrol tee, 96% off.">
<meta property="og:image" content="https://dumper.life/BFCM/trae/card-96.jpg">
<meta property="og:image:width" content="1080"><meta property="og:image:height" content="1350">
<meta property="og:url" content="https://dumper.life/BFCM/trae/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/cover-600.jpg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0806;--ink:#fbf1dc;--mute:#bfa37f;--gold:#f6b93b;--gold2:#ffe7a3;--fire:#ff6a1a;--ember:#c2410c;--card:#1b120c;--card2:#24170e;--line:#3d2a1a}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#4a210a 0%,transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.splash{text-align:center;padding:40px 16px 28px}
.splash img.logo{width:min(80vw,460px);height:auto;filter:drop-shadow(0 6px 30px #ff7a1f55)}
.bf{font:400 clamp(54px,13vw,120px)/.95 Anton,Impact,sans-serif;letter-spacing:.02em;margin-top:10px;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#d98a1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.off{font:400 clamp(34px,8vw,72px)/1 Anton,Impact,sans-serif;color:var(--fire);margin-top:6px;text-shadow:0 4px 30px #ff6a1a55}
.code{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:10px 10px 10px 22px;border-radius:999px;background:#140c07;border:1px solid #8a5a22}
.code span{font:400 26px Anton;letter-spacing:.12em;color:var(--gold)}
.code button{font:800 14px Inter;padding:10px 16px;border-radius:999px;border:0;cursor:pointer;color:#1a0f05;background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,#d98a1c)}
.sub{color:var(--mute);margin-top:12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:20px 0 40px}
.tee{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.tee:hover{border-color:var(--gold)}
.tee img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#1c1c1e}
.tee div{padding:10px 12px 14px}
.tee b{display:block;font-size:15px}
.tee .p{margin-top:4px;font-weight:800;color:var(--fire)}
.tee .p s{color:var(--mute);font-weight:600;margin-right:6px}
.tee .go{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.stream{margin:26px auto 0;max-width:560px;padding:16px 18px;border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line)}
.stream h3{font:400 22px/1.1 Anton,Impact,sans-serif;letter-spacing:.06em;color:var(--gold)}
.stream .svc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stream a{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#140c07;border:1px solid #8a5a22;text-decoration:none;font-weight:800}
.stream a:hover{border-color:var(--gold)}
.stream svg{width:24px;height:24px}
.stream .ig{margin:12px 0 0;font-size:14px;opacity:.85}
.stream .ig b{color:var(--gold)}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center;max-width:820px;margin:28px auto 0;padding:16px;border-radius:20px;text-align:left;text-decoration:none;background:linear-gradient(180deg,#2a1408,#160b05);border:2px solid var(--gold);box-shadow:0 0 0 1px #f6b93b33,0 18px 60px #ff6a1a33}
.feat img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;display:block}
.feat .eb{display:inline-block;font:400 14px Anton,Impact,sans-serif;letter-spacing:.2em;color:#1a0f05;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:4px 10px;border-radius:6px}
.feat h2{font:400 clamp(34px,6vw,56px)/.95 Anton,Impact,sans-serif;letter-spacing:.02em;margin-top:12px;color:var(--ink)}
.feat .p{margin-top:10px;font:800 22px Inter;color:var(--fire)}
.feat .p s{color:var(--mute);font-weight:600;margin-right:8px}
.feat .buy{display:inline-block;margin-top:16px;font:800 16px Inter;padding:14px 22px;border-radius:999px;color:#1a0f05;background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,#d98a1c)}
.feat .c{margin-top:12px;color:var(--mute);font-size:14px}
.feat .c b{color:var(--gold);letter-spacing:.1em}
@media (max-width:640px){.feat{grid-template-columns:1fr;text-align:center}}
footer{padding:30px 0 50px;text-align:center;color:var(--mute);font-size:13px}
footer a{color:var(--gold)}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="splash">
  <a href="/"><img class="logo" src="/img/logo.png" alt="Dump Patrol — The Mixtape"></a>
  <div class="bf">BLACK FRIDAY</div>
  <div class="off">96% OFF ALL MERCH</div>
  <div class="code"><span>DUMPER96</span><button id="copy">Copy code</button></div>
  <div class="sub">Enter the code at checkout · every tee, every size · while the sale runs</div>
  <a class="feat" id="feat" hidden></a>
  <div class="stream" id="stream" hidden><h3>STREAMING NOW</h3><div class="svc" id="svc"></div><p class="ig">Now on <b>Instagram &amp; TikTok</b>: search “Dump Patrol” to add it to your posts and stories.</p></div>
</header>
<main class="wrap"><div class="grid" id="tees"></div></main>
<footer>Dump Patrol — The Mixtape · <a href="/">dumper.life</a></footer>
<script src="/data.js?v=1795220791"></script>
<script>
const D = window.DP;
// ?tee=<id> (or <html data-tee>) puts that tee up front as a featured pick (e.g. /BFCM/trae/ → came-in-late)
const PICKS = { 'came-in-late': "TRAE'S TEE" };
const pick = D.merch.find(m => m.id === (document.documentElement.dataset.tee || new URLSearchParams(location.search).get('tee')));
if (pick) {
  const f = document.getElementById('feat'), href = pick.url || D.shop.home || '/#merch';
  f.href = href; if (href.startsWith('http')) { f.target = '_blank'; f.rel = 'noopener'; }
  f.innerHTML = `<img src="/img/tee-${pick.id}.jpg" alt="${pick.name}"><div><span class="eb">${PICKS[pick.id] || 'FEATURED TEE'}</span><h2>${pick.name.toUpperCase()}</h2><div class="p"><s>$1,000</s>$40 with code</div><span class="buy">Shop this tee →</span><div class="c">Code <b>${D.shop.code}</b> at checkout</div></div>`;
  f.hidden = false;
}
document.getElementById('tees').innerHTML = D.merch.map(m => {
  const href = m.url || D.shop.home || '/#merch';
  return `<a class="tee" href="${href}" ${href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}><img src="/img/tee-${m.id}.jpg" alt="${m.name}" loading="lazy"><div><b>${m.name}</b><div class="p"><s>$1,000</s>$40 with code</div><span class="go">Shop →</span></div></a>`;
}).join('');
const ICON = {
  spotify:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1DB954"/><path d="M6.5 9.3c3.8-1.1 8-.8 11.2 1M7 12.4c3.1-.9 6.6-.6 9.3.9M7.6 15.3c2.5-.6 5-.4 7.2.8" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
  apple:'<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#FA2D48"/><path d="M15.5 5.5v8.7a2.2 2.2 0 1 1-1.4-2V8.1l-4.6 1v6.6a2.2 2.2 0 1 1-1.4-2V6.9z" fill="#fff"/></svg>',
  youtube:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#FF0000"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="1.3"/><path d="M10.3 9.3v5.4l4.4-2.7z" fill="#fff"/></svg>',
};
const svc = D.LINKS.top.filter(s => ICON[s.id] && s.url);
if (svc.length) {
  document.getElementById('svc').innerHTML = svc.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${ICON[s.id]}${s.name}</a>`).join('');
  document.getElementById('stream').hidden = false;
}
const b = document.getElementById('copy');
b.onclick = async () => { try { await navigator.clipboard.writeText('DUMPER96'); b.textContent = 'Copied ✓'; } catch { b.textContent = 'DUMPER96'; } };
</script>
<script src="/t.js?v=3" defer></script>
</body>
</html>
