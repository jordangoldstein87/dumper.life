:root{--bg:#0d0907;--ink:#f6ead2;--mute:#b8a68a;--gold:#f5b73c;--fire:#ff5a1f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px 16px;text-align:center}
img{width:min(100%,460px);border-radius:12px;display:block;margin:0 auto 18px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,a{font:800 15px system-ui;padding:12px 20px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:none;text-decoration:none;cursor:pointer}
.solid{background:var(--gold);color:#1a0f05}

<body>
<main>
  <img src="/BFCM/card2.jpg" alt="Dumper.life Fan Club — Black Friday sale, 96% off all merch, code DUMPER96">
  <div class="row">
    <button class="solid" id="copy">Copy code DUMPER96</button>
    <a id="shop" href="/BFCM/">Shop the merch</a>
  </div>
  <p>Enter the code at checkout. Applies to all Dump Patrol merch.</p>
</main>
<script src="../data.js?v=1794037720"></script>
<script>
const b = document.getElementById('copy');
b.onclick = async () => { try { await navigator.clipboard.writeText('DUMPER96'); b.textContent = 'Copied ✓'; } catch { b.textContent = 'DUMPER96'; } };
if (window.DP && DP.shop.home) document.getElementById('shop').href = DP.shop.home;
</script>
